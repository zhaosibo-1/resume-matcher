name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行单元测试
        # 测试全程不需要任何 API Key：
        # 解析阶段自动降级到规则引擎，大模型调用全部由假客户端（ScriptedLLM）接管
        env:
          LLM_API_KEY: ""
          PARSER_ENGINE: ""
          STORE_PERSIST: "false"
        run: pytest -v

  e2e:
    name: 端到端黑盒验收
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动服务（后台）
        # 无 Key 启动 = 规则引擎模式：解析、归一化、打分、面试题生成全都是真实链路
        env:
          LLM_API_KEY: ""
          STORE_PERSIST: "false"
          DATA_DIR: "/tmp/rm-data"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8111 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --noproxy '*' http://127.0.0.1:8111/api/health > /dev/null; then
              echo "服务已就绪"; break
            fi
            sleep 2
          done
          curl -sf --noproxy '*' http://127.0.0.1:8111/api/health || { echo "服务启动失败"; cat /tmp/uvicorn.log; exit 1; }

      - name: 运行端到端验收脚本
        run: python scripts/e2e_check.py http://127.0.0.1:8111

      - name: 失败时打印服务日志
        if: failure()
        run: cat /tmp/uvicorn.log

  docker:
    name: 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t resume-matcher:ci .

      - name: 冒烟测试（启动容器并探测健康检查）
        run: |
          docker run -d --name rm-ci -p 8000:8000 resume-matcher:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "服务已就绪"; curl -s http://127.0.0.1:8000/api/health; exit 0
            fi
            sleep 2
          done
          echo "服务未能在 60 秒内就绪"; docker logs rm-ci; exit 1
